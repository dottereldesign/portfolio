<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-label="Stylised laptop">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a7aaad"/>
      <stop offset="0.55" stop-color="#5f6266"/>
      <stop offset="1" stop-color="#27292c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15120f"/>
      <stop offset="0.6" stop-color="#090a09"/>
      <stop offset="1" stop-color="#25110b"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#83878b"/>
      <stop offset="1" stop-color="#323438"/>
