    <radialGradient id="glow">
      <stop offset="0" stop-color="#ff5a24" stop-opacity=".42"/>
      <stop offset="1" stop-color="#ff5a24" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
